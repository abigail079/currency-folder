<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
    <style>
body{
    background-color: #fce7fc;
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
}
.container{
    background-color: azure;
    width: 300px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
}
h1{
    color: #be185d;
    font-size: 25px;
}
label{
    display: block;
    margin-bottom: 10px;
}
input{
    width: 90%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
button{
    background-color: #db2777;
    color: #fff;
    padding: 12px;
    width: 100%;
    margin-top: 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover{
    background-color: #be185d;
}
h2{
    color: #be185d;
    margin-top: 25px;
}
    </style> 
</head>
<body>
     <div class="container">
       <h1>Dollar To Naira</h1>
       <label>ENTER AMOUNT IN DOLLARS ($)</label>
       <input type="number" id="amount">
       <button id="convertBtn">CONVERT TO NAIRA (N)</button>
       <h2 id="result">N0.00</h2>
    </div> 

<canvas  width="200" id="board">
    
</canvas>

</html>
